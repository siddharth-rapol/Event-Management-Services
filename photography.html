<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography - Event Management Services</title>
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }

    /* Navbar */
    .navbar {
      display: flex; justify-content: space-between; align-items: center;
      background: #faf8f5; padding: 10px 20px; position: sticky; top: 0; z-index: 1000;
      border-bottom: 2px solid #c6c0b3;
    }
    .logo img { height: 45px; }
    .main-heading { flex: 1; text-align: center; font-size: 22px; font-weight: bold; color: #4c5f4e; }
    .nav-links { list-style: none; display: flex; gap: 20px; }
    .nav-links li a { text-decoration: none; color: #4c5f4e; font-weight: bold; transition: 0.3s; }
    .nav-links li a:hover { color: #c6c0b3; }

    /* Content */
    main { max-width: 900px; margin: 20px auto; padding: 20px; text-align: center; }
    h2 { font-size: 28px; margin-bottom: 20px; color: #4c5f4e; }

    .photo-box {
      background: #faf8f5; padding: 0; margin: 15px auto;
      border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 500px;
      overflow: hidden;
    }
    .photo-box img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
    }

    /* Footer */
    footer { background: #4c5f4e; color: #faf8f5; text-align: center; padding: 20px; margin-top: 30px; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <nav class="navbar">
      <a href="index.html"><div class="logo"><img src="logo.png" alt="Logo"></div></a>
      <h1 class="main-heading">EVENT MANAGEMENT SERVICES</h1>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="rentals.html">Rentals</a></li>
        <li><a href="photography.html">Photography</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Photography Content -->
  <main>
    <h2>📸 Photography Packages</h2>

    <div class="photo-box">
      <img src="hourly.jpg" alt="Hourly Package">
    </div>

    <div class="photo-box">
      <img src="fullday.jpg" alt="Full Day Package">
    </div>

    <div class="photo-box">
      <img src="specialevent.jpg" alt="Special Event Coverage">
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2025 Event Management Services | All Rights Reserved</p>
  </footer>

</body>
</html>
